<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Research orchestration platform architecture</title><desc id="desc">Research submissions run as durable Kubernetes workloads with checkpoints, provenance, and governed results.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b6cbc1" stroke-opacity=".45"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#1e6654"/></marker></defs>
  <rect width="1200" height="520" fill="#dce8e2"/><rect width="1200" height="520" fill="url(#grid)"/>
  <text x="54" y="63" fill="#1e6654" font-family="monospace" font-size="18" letter-spacing="3">RESEARCH WORKFLOW PLATFORM</text><text x="54" y="95" fill="#3a5059" font-family="sans-serif" font-size="17">Durable, reproducible workloads for sensitive, multi-stage evaluation pipelines.</text>
  <g font-family="monospace" font-size="15" fill="#071a26"><rect x="54" y="182" width="216" height="142" rx="8" fill="#071a26"/><text x="78" y="224" fill="#d7ff5f">01 / SUBMIT</text><text x="78" y="255" fill="#dce8e2">research workflow</text><text x="78" y="281" fill="#dce8e2">access policy</text><rect x="354" y="182" width="216" height="142" rx="8" fill="#9de6c6"/><text x="378" y="224">02 / ORCHESTRATE</text><text x="378" y="255">Kubernetes jobs</text><text x="378" y="281">checkpoint + retry</text><rect x="654" y="182" width="216" height="142" rx="8" fill="#ffa56c"/><text x="678" y="224">03 / OBSERVE</text><text x="678" y="255">metrics + traces</text><text x="678" y="281">failure recovery</text><rect x="954" y="182" width="192" height="142" rx="8" fill="#071a26"/><text x="978" y="224" fill="#d7ff5f">04 / PROVE</text><text x="978" y="255" fill="#dce8e2">provenance</text><text x="978" y="281" fill="#dce8e2">audited outputs</text></g>
  <g stroke="#1e6654" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M270 253H342"/><path d="M570 253H642"/><path d="M870 253H942"/></g><text x="54" y="442" fill="#3a5059" font-family="monospace" font-size="14">PLATFORM CONCERNS: ISOLATION / PERSISTENT STATE / OBSERVABILITY / REPRODUCIBILITY</text>
</svg>
