<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Regulated data platform architecture</title><desc id="desc">Source systems pass through validation, resilient pipeline controls, audit events, and governed data products.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#274454" stroke-opacity=".38"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d7ff5f"/></marker></defs>
  <rect width="1200" height="520" fill="#071a26"/><rect width="1200" height="520" fill="url(#grid)"/>
  <text x="54" y="63" fill="#9de6c6" font-family="monospace" font-size="18" letter-spacing="3">REGULATED DATA PIPELINE</text><text x="54" y="95" fill="#dce8e2" font-family="sans-serif" font-size="17">Reliability and auditability designed into high-volume integration flows.</text>
  <g font-family="monospace" font-size="15" fill="#071a26"><rect x="54" y="182" width="216" height="142" rx="8" fill="#d7ff5f"/><text x="78" y="224">01 / SOURCES</text><text x="78" y="255">clinical + market</text><text x="78" y="281">operational data</text><rect x="354" y="182" width="216" height="142" rx="8" fill="#9de6c6"/><text x="378" y="224">02 / VALIDATE</text><text x="378" y="255">quality contracts</text><text x="378" y="281">dead-letter paths</text><rect x="654" y="182" width="216" height="142" rx="8" fill="#ffa56c"/><text x="678" y="224">03 / RECOVER</text><text x="678" y="255">retries + logging</text><text x="678" y="281">runbook response</text><rect x="954" y="182" width="192" height="142" rx="8" fill="#dce8e2"/><text x="978" y="224">04 / SERVE</text><text x="978" y="255">audited data</text><text x="978" y="281">consumer systems</text></g>
  <g stroke="#d7ff5f" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M270 253H342"/><path d="M570 253H642"/><path d="M870 253H942"/></g><text x="54" y="442" fill="#dce8e2" font-family="monospace" font-size="14">CONTROLS: VALIDATION / RETRY / ALERTING / TRACEABILITY / OPERATIONS RUNBOOKS</text>
</svg>
