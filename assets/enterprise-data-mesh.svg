<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise data mesh architecture</title><desc id="desc">Domain sources are ingested through quality controls into governed layers before being served as documented data products.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#274454" stroke-opacity=".38"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d7ff5f"/></marker></defs>
  <rect width="1200" height="520" fill="#071a26"/><rect width="1200" height="520" fill="url(#grid)"/>
  <text x="54" y="63" fill="#9de6c6" font-family="monospace" font-size="18" letter-spacing="3">ENTERPRISE DATA PRODUCT PLATFORM</text><text x="54" y="95" fill="#dce8e2" font-family="sans-serif" font-size="17">Reusable, observable data delivery from domain sources to governed consumer interfaces.</text>
  <g font-family="monospace" font-size="15" fill="#071a26"><rect x="54" y="182" width="216" height="142" rx="8" fill="#d7ff5f"/><text x="78" y="224">01 / INGEST</text><text x="78" y="255">batch + streaming</text><text x="78" y="281">schema controls</text><rect x="354" y="182" width="216" height="142" rx="8" fill="#9de6c6"/><text x="378" y="224">02 / ORCHESTRATE</text><text x="378" y="255">durable state</text><text x="378" y="281">retry + recovery</text><rect x="654" y="182" width="216" height="142" rx="8" fill="#ffa56c"/><text x="678" y="224">03 / GOVERN</text><text x="678" y="255">lineage + quality</text><text x="678" y="281">policy defaults</text><rect x="954" y="182" width="192" height="142" rx="8" fill="#dce8e2"/><text x="978" y="224">04 / SERVE</text><text x="978" y="255">data products</text><text x="978" y="281">API patterns</text></g>
  <g stroke="#d7ff5f" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M270 253H342"/><path d="M570 253H642"/><path d="M870 253H942"/></g><text x="54" y="442" fill="#dce8e2" font-family="monospace" font-size="14">DESIGN FOCUS: REUSE / RELIABILITY / LINEAGE / SECURE ACCESS / DOMAIN ENABLEMENT</text>
</svg>
